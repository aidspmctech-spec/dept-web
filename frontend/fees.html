<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees & Payments | AIDS Student Portal</title>
    <link rel="stylesheet" href="css/modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-brand">AIDS Portal</div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="profile.html">My Profile</a></li>
                <li><a href="fees.html" class="active">Fees & Payments</a></li>
                <li><a href="academics.html">Academics</a></li>
                <li><a href="achievements.html">Achievements</a></li>
                <li><a href="certifications.html">Certifications</a></li>
                <li><a href="hostel.html">Hostel</a></li>
                <li><a href="transport.html">Transport</a></li>
            </ul>
            <div style="padding: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <button id="logoutBtn" class="btn btn-ghost" style="width: 100%; color: white; border-color: white;">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Fee Management</h2>
                <div id="userBadge" style="font-weight: 600; color: var(--text-muted);"></div>
            </header>

            <div id="feesDashboard">
                <!-- Summary Cards -->
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="label">Total Fee</div>
                        <div class="value" id="totalFee">₹0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Amount Paid</div>
                        <div class="value" id="totalPaid" style="color: var(--success);">₹0</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">Pending Balance</div>
                        <div class="value" id="totalPending" style="color: var(--error);">₹0</div>
                    </div>
                </div>

                <!-- Fee Breakdown Table -->
                <div style="background: white; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 2rem;">
                    <h3 style="margin-bottom: 1.5rem;">Fee Breakdown</h3>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left;">
                            <thead>
                                <tr style="border-bottom: 2px solid var(--border-color);">
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Fee Type</th>
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Total</th>
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Paid</th>
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Pending</th>
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Due Date</th>
                                </tr>
                            </thead>
                            <tbody id="feeBreakdownBody">
                                <!-- Rows injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Payment History -->
                <div style="background: white; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow);">
                    <h3 style="margin-bottom: 1.5rem;">Payment History</h3>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse; text-align: left;">
                            <thead>
                                <tr style="border-bottom: 2px solid var(--border-color);">
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Date</th>
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Amount</th>
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Mode</th>
                                    <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Reference</th>
                                </tr>
                            </thead>
                            <tbody id="paymentHistoryBody">
                                <!-- Rows injected by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/fees.js"></script>
</body>
</html>

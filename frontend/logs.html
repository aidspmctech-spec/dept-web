<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs | AIDS Portal</title>
    <link rel="stylesheet" href="css/modern.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-brand">AIDS Admin</div>
            <ul class="sidebar-nav">
                <li><a href="admin.html">Department Stats</a></li>
                <li><a href="staff.html">Staff Verification</a></li>
                <li><a href="logs.html" class="active">Security Logs</a></li>
            </ul>
            <div style="padding: 1rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <button id="logoutBtn" class="btn btn-ghost" style="width: 100%; color: white; border-color: white;">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>System Audit Logs</h2>
                <div id="userBadge" style="font-weight: 600; color: var(--text-muted);"></div>
            </header>

            <div id="logsDashboard">
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem; align-items: flex-end;">
                    <div class="form-group" style="margin-bottom: 0; flex-grow: 1;">
                        <label class="form-label">Filter by Action</label>
                        <input type="text" id="filterAction" class="form-input" placeholder="e.g. LOGIN, VERIFY_ACHIEVEMENT">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <button id="filterBtn" class="btn btn-primary">Filter Logs</button>
                    </div>
                </div>

                <div style="background: white; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; text-align: left;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--border-color);">
                                <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Timestamp</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">User</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Action</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Module</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Result</th>
                                <th style="padding: 1rem; color: var(--text-muted); font-weight: 600;">Remarks</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody">
                            <!-- Rows injected by logs.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/logs.js"></script>
</body>
</html>
